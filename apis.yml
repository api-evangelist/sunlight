image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/sunlight.png
name: Sunlight
description: >-
  Sunlight is an educational-spending platform that lets organizations fund
  learning for their people. Administrators create groups, invite registered or
  unregistered members, allocate a per-user education budget ("sunlight"), and
  let members place orders for courses, books and subscriptions from providers
  such as Amazon and Platzi, while an activity feed tracks what members join and
  buy. Its REST API is built on the JSON:API specification (media type
  application/vnd.api+json) with Bearer-token authentication, and exposes
  groups, group membership and invitations, per-user credit/budget transactions,
  orders, and activities. Sunlight was backed by Seedcamp and Speedinvest.
