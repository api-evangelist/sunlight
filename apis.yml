x-operational-note: >-
  As of 2026-07-21 the documented API backend host (app.sunlight.is /
  api.sunlight.is) is a dangling CNAME to a decommissioned AWS Elastic
  Beanstalk environment (sunlight-production.eu-west-1.elasticbeanstalk.com, no
  A record) and the apex sunlight.is TLS endpoint returns a handshake
  internal-error alert. The Slate developer docs (docs.sunlight.is, GitHub
  Pages) and the Webflow marketing site (www.sunlight.is) remain online. The
  API surface captured here is faithfully harvested from the live public docs;
  the service itself appears dormant.
